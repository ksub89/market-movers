<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Movers Feed</title>
<style>
  :root{
    --bg:#0b0c10; --card:#15171c; --border:#242731; --text:#e8e9ec; --muted:#8a8f9c;
    --green:#1fae5f; --red:#ff4d4f; --accent:#3b82f6;
  }
  [data-theme="light"]{
    --bg:#f7f8fa; --card:#ffffff; --border:#e3e5e9; --text:#15171c; --muted:#6b7280;
    --green:#17803d; --red:#dc2626; --accent:#2563eb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    transition:background .15s, color .15s;
  }
  header{
    padding:16px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  header h1{ font-size:18px; margin:0; font-weight:700; }
    .sub{ color:var(--muted); font-size:12px; margin-top:2px; }
  .controls{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pill{
    background:var(--card); border:1px solid var(--border); color:var(--muted);
    font-size:12px; padding:5px 10px; border-radius:20px; cursor:pointer; user-select:none;
  }
  .pill.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .iconbtn{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    font-size:14px; padding:5px 10px; border-radius:20px; cursor:pointer; user-select:none;
  }
  #feed{ max-width:900px; margin:0 auto; padding:10px 14px 60px; }
  .row{
    display:flex; align-items:flex-start; gap:12px;
    padding:12px 6px; border-bottom:1px solid var(--border);
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(-3px);} to{opacity:1; transform:none;} }
  .time{
    width:64px; flex:0 0 64px; color:var(--muted); font-size:12px; padding-top:2px; font-variant-numeric:tabular-nums;
  }
  .bar{ width:3px; align-self:stretch; border-radius:2px; flex:0 0 3px; }
  .bar.up{ background:var(--green); } .bar.down{ background:var(--red); }
  .content{ flex:1; min-width:0; }
  .line1{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .sym{ font-weight:700; font-size:14.5px; }
  .chg{ font-weight:700; font-size:13.5px; }
  .chg.up{ color:var(--green); } .chg.down{ color:var(--red); }
  .price{ color:var(--muted); font-size:12.5px; }
  .tag{
    font-size:10.5px; color:var(--muted); border:1px solid var(--border);
    padding:1px 6px; border-radius:8px; margin-left:auto;
  }
  .headline{ margin-top:3px; font-size:13.5px; line-height:1.4; }
  .headline a{ color:var(--text); text-decoration:none; }
  .headline a:hover{ color:var(--accent); text-decoration:underline; }
  .name{ color:var(--muted); font-size:11.5px; margin-top:1px; }
  #empty{ text-align:center; color:var(--muted); padding:40px 0; font-size:13px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Market Movers Feed</h1>
    <div class="sub" id="lastUpdated"></div>
  </div>
  <div class="controls" id="filters">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="up">Gainers</span>
    <span class="pill" data-f="down">Losers</span>
    <span class="pill" data-f="Premarket">Premarket</span>
    <span class="pill" data-f="Afterhours">Afterhours</span>
    <span class="pill" data-f="Premarket Earnings">PM Earnings</span>
    <span class="pill" data-f="Afterhours Earnings">AH Earnings</span>
    <span class="iconbtn" id="themeToggle">☀️ Light</span>
  </div>
</header>

<div id="feed"></div>
<div id="empty" style="display:none;">No movers match this filter.</div>

<script>
const DATA = [];
const GENERATED_AT = "2026-09-06T07:18:20.044418+00:00";
  
function fmtTime(iso){
  const d = new Date(iso);
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h=12;
  return h + ':' + String(m).padStart(2,'0') + ' ' + ap;
}

let activeFilter = 'all';

function render(){
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty');
  feed.innerHTML = '';
  const rows = DATA.filter(e=>{
    if(activeFilter==='all') return true;
    if(activeFilter==='up' || activeFilter==='down') return e.direction===activeFilter;
    return e.source_page===activeFilter;
  });
  empty.style.display = rows.length ? 'none' : 'block';
  for(const e of rows){
    const div = document.createElement('div');
    div.className = 'row';
    const sign = e.direction === 'up' ? '+' : '';
    div.innerHTML = `
      <div class="time">${fmtTime(e.time_iso)}</div>
      <div class="bar ${e.direction}"></div>
      <div class="content">
        <div class="line1">
          <span class="sym">${e.symbol}</span>
          <span class="chg ${e.direction}">${sign}${e.chg_pct}%</span>
          <span class="price">($${e.price.toFixed(2)})</span>
          <span class="tag">${e.source_page}</span>
        </div>
        <div class="headline"><a href="${e.url}" target="_blank" rel="noopener">${e.headline}</a></div>
        <div class="name">${e.name}</div>
      </div>`;
    feed.appendChild(div);
  }
}

document.getElementById('filters').addEventListener('click', (ev)=>{
  const p = ev.target.closest('.pill');
  if(!p) return;
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active');
  activeFilter = p.dataset.f;
  render();
});

const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', ()=>{
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if(isLight){
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = '☀️ Light';
  } else {
    document.documentElement.setAttribute('data-theme','light');
    themeToggle.textContent = '🌙 Dark';
  }
});

function showLastUpdated(){
  const d = new Date(GENERATED_AT);
  const label = d.toLocaleString('en-US', {
    timeZone: 'America/New_York',
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
    timeZoneName: 'short'
  });
  document.getElementById('lastUpdated').textContent = 'Last updated: ' + label;
}
showLastUpdated();
render();
</script>
</body>
</html>
