<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Movers Feed</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --border:#e3e5e9; --text:#15171c; --muted:#6b7280;
    --green:#17803d; --red:#dc2626; --accent:#2563eb; --greenSoft:rgba(23,128,61,.10); --redSoft:rgba(220,38,38,.10);
    --borderStrong:#c7cbd3; --colTint:rgba(15,23,42,.045);
  }
  [data-theme="dark"]{
    --bg:#0b0c10; --card:#15171c; --border:#242731; --text:#e8e9ec; --muted:#8a8f9c;
    --green:#1fae5f; --red:#ff4d4f; --accent:#3b82f6; --greenSoft:rgba(31,174,95,.15); --redSoft:rgba(255,77,79,.15);
    --borderStrong:#3a3f4c; --colTint:rgba(255,255,255,.045);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    transition:background .15s, color .15s;
  }
  /* Top bar: page tabs (left) + theme toggle (right) — always on top */
  .topbar{
    padding:12px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    position:sticky; top:0; background:var(--bg); z-index:6;
  }
  .pagetabs{ display:flex; gap:8px; }
  .pagetab{
    background:var(--card); border:1px solid var(--border); color:var(--muted);
    font-size:13px; font-weight:600; padding:8px 16px; border-radius:10px;
    cursor:pointer; user-select:none;
  }
  .pagetab.active{ color:#fff; background:var(--accent); border-color:var(--accent); }
  .page{ display:none; }
  .page.active{ display:block; }

  header{
    padding:14px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    background:var(--bg);
  }
  header h1{ font-size:18px; margin:0; font-weight:700; }
  .sub{ color:var(--muted); font-size:12px; margin-top:2px; }
  .controls{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pill{
    background:var(--card); border:1px solid var(--border); color:var(--muted);
    font-size:12px; padding:5px 10px; border-radius:20px; cursor:pointer; user-select:none;
  }
  .pill.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .iconbtn{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    font-size:14px; padding:5px 10px; border-radius:20px; cursor:pointer; user-select:none;
  }

  #feed{ max-width:900px; margin:0 auto; padding:10px 14px 60px; }
  .row{
    display:flex; align-items:flex-start; gap:12px;
    padding:12px 6px; border-bottom:1px solid var(--border);
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(-3px);} to{opacity:1; transform:none;} }
  .time{
    width:64px; flex:0 0 64px; color:var(--muted); font-size:12px; padding-top:2px; font-variant-numeric:tabular-nums;
  }
  .bar{ width:3px; align-self:stretch; border-radius:2px; flex:0 0 3px; }
  .bar.up{ background:var(--green); } .bar.down{ background:var(--red); }
  .content{ flex:1; min-width:0; }
  .line1{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .sym{ font-weight:700; font-size:14.5px; }
  .chg{ font-weight:700; font-size:13.5px; }
  .chg.up{ color:var(--green); } .chg.down{ color:var(--red); }
  .price{ color:var(--muted); font-size:12.5px; }
  .tag{
    font-size:10.5px; color:var(--muted); border:1px solid var(--border);
    padding:1px 6px; border-radius:8px; margin-left:auto;
  }
  .headline{ margin-top:3px; font-size:13.5px; line-height:1.4; }
  .headline a{ color:var(--text); text-decoration:none; }
  .headline a:hover{ color:var(--accent); text-decoration:underline; }
  .name{ color:var(--muted); font-size:11.5px; margin-top:1px; }
  #empty{ text-align:center; color:var(--muted); padding:40px 0; font-size:13px; }

  /* Market Maps */
  #maps{ max-width:1100px; margin:0 auto; padding:16px 14px 60px; }
  .maps-meta{ color:var(--muted); font-size:12px; margin-bottom:12px; }
  .maps-table-wrap{ overflow-x:auto; border-radius:10px; }
  table.maps{ border-collapse:collapse; width:100%; font-size:12.5px; white-space:nowrap; border:1px solid var(--border); }
  table.maps th, table.maps td{ padding:8px 10px; text-align:right; border:1px solid var(--border); }
  table.maps th{ position:sticky; top:0; background-color:var(--card); color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  table.maps td:first-child, table.maps th:first-child{ text-align:left; position:sticky; left:0; background-color:var(--bg); }
  table.maps th:first-child{ background-color:var(--card); }
  table.maps tbody tr:hover td{ background-color:var(--card); }
  /* Column-pair shading: Above/Below for the same MA period get a shared
     translucent tint so the 5D / 10D / 20D / 50D groupings are visually
     obvious at a glance, alternating so neighboring pairs don't blur together.
     Rows themselves rely on the grid borders for separation, not tinting. */
  table.maps th:nth-child(2), table.maps th:nth-child(3),
  table.maps th:nth-child(6), table.maps th:nth-child(7),
  table.maps td:nth-child(2), table.maps td:nth-child(3),
  table.maps td:nth-child(6), table.maps td:nth-child(7){
    background-image: linear-gradient(var(--colTint), var(--colTint));
  }
  .half-day{ color:var(--muted); font-weight:600; }
  .grp{ font-weight:700; }
  .grp.above{ color:var(--green); }
  .grp.below{ color:var(--red); }
  .extreme-hi{ background-color:var(--greenSoft); background-image:none; font-weight:700; }
  .extreme-lo{ background-color:var(--redSoft); background-image:none; font-weight:700; }
  /* Extreme highlighting must beat the column-pair tint, so an extreme cell
     inside a shaded column still reads as a clean, undiluted green/red. */
  table.maps td:nth-child(2).extreme-hi, table.maps td:nth-child(3).extreme-hi,
  table.maps td:nth-child(6).extreme-hi, table.maps td:nth-child(7).extreme-hi{ background-image:none; }
  table.maps td:nth-child(2).extreme-lo, table.maps td:nth-child(3).extreme-lo,
  table.maps td:nth-child(6).extreme-lo, table.maps td:nth-child(7).extreme-lo{ background-image:none; }
  /* Calendar separators: a heavier neutral line between two different months,
     a heavier colored line between two different years (e.g. Dec -> Jan). */
  table.maps tbody tr.month-sep td{ border-bottom:3px solid var(--borderStrong); }
  table.maps tbody tr.year-sep td{ border-bottom:3px solid var(--accent); }
  #mapsEmpty{ text-align:center; color:var(--muted); padding:40px 0; font-size:13px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="pagetabs" id="pagetabs">
    <span class="pagetab active" data-page="movers">Movers</span>
    <span class="pagetab" data-page="maps">Market Maps</span>
  </div>
  <span class="iconbtn" id="themeToggle">🌙 Dark</span>
</div>

<header>
  <div>
    <h1 id="pageTitle">Market Movers Feed</h1>
    <div class="sub" id="lastUpdated"></div>
  </div>
  <div class="controls" id="filters">
    <span class="pill active" data-f="all">All</span>
    <span class="pill" data-f="up">Gainers</span>
    <span class="pill" data-f="down">Losers</span>
    <span class="pill" data-f="Premarket">Premarket</span>
    <span class="pill" data-f="Afterhours">Afterhours</span>
    <span class="pill" data-f="Premarket Earnings">PM Earnings</span>
    <span class="pill" data-f="Afterhours Earnings">AH Earnings</span>
  </div>
</header>

<div id="moversPage" class="page active">
  <div id="feed"></div>
  <div id="empty" style="display:none;">No movers match this filter.</div>
</div>

<div id="mapsPage" class="page">
  <div id="maps">
    <div class="maps-meta" id="mapsMeta">Loading Market Maps…</div>
    <div class="maps-table-wrap">
      <table class="maps">
        <thead>
          <tr>
            <th>Date</th>
            <th class="grp above">Above 5D</th>
            <th class="grp below">Below 5D</th>
            <th class="grp above">Above 10D</th>
            <th class="grp below">Below 10D</th>
            <th class="grp above">Above 20D</th>
            <th class="grp below">Below 20D</th>
            <th class="grp above">Above 50D</th>
            <th class="grp below">Below 50D</th>
            <th>5D Ratio</th>
            <th>10D Ratio</th>
            <th>Universe</th>
          </tr>
        </thead>
        <tbody id="mapsBody"></tbody>
      </table>
    </div>
    <div id="mapsEmpty" style="display:none;">No Market Maps data yet.</div>
  </div>
</div>

<script>
let activeFilter = 'all';
let MOVERS = [];
let MAPS_HISTORY = [];

function fmtTime(iso){
  const d = new Date(iso);
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h=12;
  return h + ':' + String(m).padStart(2,'0') + ' ' + ap;
}

function renderMovers(){
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty');
  feed.innerHTML = '';
  const rows = MOVERS.filter(e=>{
    if(activeFilter==='all') return true;
    if(activeFilter==='up' || activeFilter==='down') return e.direction===activeFilter;
    return e.source_page===activeFilter;
  });
  empty.style.display = rows.length ? 'none' : 'block';
  for(const e of rows){
    const div = document.createElement('div');
    div.className = 'row';
    const sign = e.direction === 'up' ? '+' : '';
    div.innerHTML = `
      <div class="time">${fmtTime(e.time_iso)}</div>
      <div class="bar ${e.direction}"></div>
      <div class="content">
        <div class="line1">
          <span class="sym">${e.symbol}</span>
          <span class="chg ${e.direction}">${sign}${e.chg_pct}%</span>
          <span class="price">($${e.price.toFixed(2)})</span>
          <span class="tag">${e.source_page}</span>
        </div>
        <div class="headline"><a href="${e.url}" target="_blank" rel="noopener">${e.headline}</a></div>
        <div class="name">${e.name}</div>
      </div>`;
    feed.appendChild(div);
  }
}

function pctCell(v, extremeHi, extremeLo){
  let cls = '';
  if(v >= extremeHi) cls = 'extreme-hi';
  else if(v <= extremeLo) cls = 'extreme-lo';
  return `<td class="${cls}">${v.toFixed(1)}%</td>`;
}

// Stockbee-style ratio: trailing N-day sum of "above 20-day MA" count divided
// by the trailing N-day sum of "below 20-day MA" count. `chrono` is the full
// history in ascending date order; `idx` is this row's position in it.
function rollingRatio(chrono, idx, windowLen){
  if(idx + 1 < windowLen) return null; // not enough history yet
  let sumAbove = 0, sumBelow = 0;
  for(let i = idx - windowLen + 1; i <= idx; i++){
    const c = chrono[i].counts || {};
    sumAbove += c.above_20 || 0;
    sumBelow += c.below_20 || 0;
  }
  if(sumBelow === 0) return Infinity;
  return sumAbove / sumBelow;
}

function ratioCell(v){
  if(v === null) return `<td>–</td>`;
  if(v === Infinity) return `<td class="extreme-hi">∞</td>`;
  let cls = '';
  if(v >= 2) cls = 'extreme-hi';
  else if(v <= 0.5) cls = 'extreme-lo';
  return `<td class="${cls}">${v.toFixed(2)}</td>`;
}

function renderMaps(){
  const body = document.getElementById('mapsBody');
  const empty = document.getElementById('mapsEmpty');
  body.innerHTML = '';
  empty.style.display = MAPS_HISTORY.length ? 'none' : 'block';
  // MAPS_HISTORY is stored oldest-to-newest; ratios need that chronological
  // order to sum trailing windows, so compute them before reversing for display.
  const chrono = MAPS_HISTORY;
  const rows = chrono.map((r, i) => ({
    ...r,
    ratio5: rollingRatio(chrono, i, 5),
    ratio10: rollingRatio(chrono, i, 10),
  })).reverse(); // most recent day first
  // Rows are in descending date order (today on top). A separator belongs on
  // a row when the NEXT row down (i.e. chronologically the prior trading day)
  // falls in a different month or year — that's the actual calendar boundary.
  function calendarSepClass(idx){
    if(idx + 1 >= rows.length) return '';
    const [y1, m1] = rows[idx].date.split('-');
    const [y2, m2] = rows[idx + 1].date.split('-');
    if(y1 !== y2) return 'year-sep';
    if(m1 !== m2) return 'month-sep';
    return '';
  }
  rows.forEach((r, idx) => {
    const tr = document.createElement('tr');
    tr.className = calendarSepClass(idx);
    const dateLabel = r.is_half_day ? `${r.date} <span class="half-day" title="Half trading day (early close)">*</span>` : r.date;
    tr.innerHTML = `
      <td>${dateLabel}</td>
      ${pctCell(r.pct_above_5, 80, 20)}
      ${pctCell(r.pct_below_5, 80, 20)}
      ${pctCell(r.pct_above_10, 80, 20)}
      ${pctCell(r.pct_below_10, 80, 20)}
      ${pctCell(r.pct_above_20, 80, 20)}
      ${pctCell(r.pct_below_20, 80, 20)}
      ${pctCell(r.pct_above_50, 80, 20)}
      ${pctCell(r.pct_below_50, 80, 20)}
      ${ratioCell(r.ratio5)}
      ${ratioCell(r.ratio10)}
      <td>${r.universe.toLocaleString()}</td>
    `;
    body.appendChild(tr);
  });
}

async function loadMovers(){
  try{
    const res = await fetch('movers.json?_=' + Date.now());
    const json = await res.json();
    MOVERS = json.data || [];
    showMoversUpdated(json.generated_at);
    renderMovers();
  }catch(e){
    document.getElementById('lastUpdated').textContent = 'Could not load movers.json';
  }
}

async function loadMaps(){
  try{
    const res = await fetch('market_maps.json?_=' + Date.now());
    const json = await res.json();
    MAPS_HISTORY = json.history || [];
    const latest = MAPS_HISTORY[MAPS_HISTORY.length - 1];
    const genLabel = json.generated_at ? new Date(json.generated_at).toLocaleString('en-US', {
      timeZone: 'America/New_York', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', timeZoneName:'short'
    }) : 'unknown';
    document.getElementById('mapsMeta').textContent = latest
      ? `Latest session: ${latest.date} · Universe: ${latest.universe.toLocaleString()} stocks (price > $3, volume > 100k) · Data refreshed: ${genLabel} · * = half (early-close) trading day`
      : 'No data yet — the daily job hasn\'t run.';
    renderMaps();
  }catch(e){
    document.getElementById('mapsMeta').textContent = 'Could not load market_maps.json';
  }
}

document.getElementById('filters').addEventListener('click', (ev)=>{
  const p = ev.target.closest('.pill');
  if(!p) return;
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active');
  activeFilter = p.dataset.f;
  renderMovers();
});

document.getElementById('pagetabs').addEventListener('click', (ev)=>{
  const t = ev.target.closest('.pagetab');
  if(!t) return;
  document.querySelectorAll('.pagetab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const page = t.dataset.page;
  document.getElementById('moversPage').classList.toggle('active', page==='movers');
  document.getElementById('mapsPage').classList.toggle('active', page==='maps');
  document.getElementById('filters').style.display = page==='movers' ? 'flex' : 'none';
  document.getElementById('pageTitle').textContent = page==='movers' ? 'Market Movers Feed' : 'Market Maps';
});

// Default is light mode (no data-theme attribute). Clicking switches to dark;
// clicking again switches back to light.
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', ()=>{
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = '🌙 Dark';
  } else {
    document.documentElement.setAttribute('data-theme','dark');
    themeToggle.textContent = '☀️ Light';
  }
});

function showMoversUpdated(generatedAtIso){
  const d = new Date(generatedAtIso);
  const label = d.toLocaleString('en-US', {
    timeZone: 'America/New_York',
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
    timeZoneName: 'short'
  });
  document.getElementById('lastUpdated').textContent = 'Last updated: ' + label;
}

loadMovers();
loadMaps();
</script>
</body>
</html>
