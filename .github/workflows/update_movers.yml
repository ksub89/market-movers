name: Update Movers Feed

on:
  # No `schedule:` trigger here on purpose. GitHub's own cron scheduler is
  # documented as best-effort and can silently skip firings under load —
  # that's what was leaving this feed stale for hours. Scheduling now lives
  # in a Cloudflare Worker (cloudflare-worker.js) with a Cron Trigger that
  # fires reliably every 15 minutes and calls workflow_dispatch below at the
  # right moments (same 12 ET marks this used to self-check via
  # in_run_window() — the timing logic moved to the Worker, nothing else
  # changed). workflow_dispatch below also still powers the "Last updated"
  # manual-refresh click on the Movers tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml "pandas_market_calendars==5.4.0"

      - name: Run scraper
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python update_movers.py

      - name: Commit updated feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update movers feed"
          file_pattern: docs/movers.json
