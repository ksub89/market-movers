name: Update Market Maps

on:
  schedule:
    # 22:00 UTC = 6:00pm EDT (summer) / 5:00pm EST (winter) — comfortably
    # after the 4:00pm ET close in either case, so "current volume" is final.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas_market_calendars

      - name: Run Market Maps update
        env:
          FINVIZ_API_TOKEN: ${{ secrets.FINVIZ_API_TOKEN }}
        run: python update_market_maps.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update market maps"
          file_pattern: docs/market_maps.json
