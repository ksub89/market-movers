name: Update Market Maps

on:
  schedule:
    # Targets 4:05pm ET, Mon-Fri — 5 min after the close, and deliberately
    # clear of Update Earnings' 5:00pm ET run (see update_market_maps.py's
    # in_run_window() for why: Finviz's 10-req/5s rate limit is fine for
    # either workflow alone, but not if both started at the same instant).
    # Two lines because GitHub cron is fixed UTC with no DST awareness — the
    # script's own guard no-ops whichever one is the "wrong" offset for the
    # current season, so this only actually runs once a day, at the real
    # 4:05pm ET:
    - cron: '5 20 * * 1-5'   # 4:05pm EDT (summer) — targets the 4:05pm ET mark
    - cron: '5 21 * * 1-5'   # 4:05pm EST (winter) — targets the 4:05pm ET mark
  workflow_dispatch:   # lets you trigger it manually from the Actions tab — always runs, bypasses the time-window guard

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests "pandas_market_calendars==5.4.0"

      - name: Run Market Maps update
        env:
          FINVIZ_API_TOKEN: ${{ secrets.FINVIZ_API_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python update_market_maps.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update market maps"
          file_pattern: docs/market_maps.json
