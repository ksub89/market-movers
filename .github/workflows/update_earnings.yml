name: Update Earnings

on:
  # No `schedule:` trigger here on purpose — GitHub's own cron scheduler is
  # best-effort and can silently skip firings (this is why earnings.json
  # went 5 days stale). Scheduling now lives in a Cloudflare Worker
  # (cloudflare-worker.js) with a reliable Cron Trigger that calls
  # workflow_dispatch below at 8:00am and 5:00pm ET (still deliberately
  # clear of Update Market Maps' 4:05pm ET run for the Finviz rate-limit
  # reasoning described in update_earnings.py's in_run_window(), unchanged).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests "pandas_market_calendars==5.4.0"

      - name: Run Earnings update
        env:
          FINVIZ_API_TOKEN: ${{ secrets.FINVIZ_API_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python update_earnings.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update earnings"
          file_pattern: docs/earnings.json
